#cloud-config
package_update: true
packages:
  - nginx
runcmd:
  - systemctl enable nginx
  - systemctl start nginx
  - |
    cat <<EOF > /usr/share/nginx/html/index.html
    <!DOCTYPE html>
    <html>
    <head>
        <title>CSC cPouta Assignment</title>
        <style>
            body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; color: #333; }
            h1 { color: #0056b3; }
            .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Hello from cPouta!</h1>
            <p><strong>Student:</strong> ${student_name}</p>
            <p><strong>Message:</strong> ${page_message}</p>
        </div>
    </body>
    </html>
    EOF
